<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ypê Próspero - Gilliard Martins</title>
    
    <!-- Configurações vitais para forçar tela cheia (Standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ypê Próspero">
    <meta name="theme-color" content="#008060">
    
    <link rel="manifest" href="manifest.json">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .spinner {
            width: 45px; height: 45px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #008060;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #444; font-size: 15px; margin: 5px 0; }
        .identificacao { font-weight: bold; color: #008060; font-size: 16px; }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <p class="identificacao">Eu sou próspero - Gilliard Martins</p>
    <p>Abrindo o aplicativo em tela cheia...</p>

    <script>
        // Redirecionamento instantâneo para a página oficial
        window.location.replace("https://www.promocaoype.com.br/index#inicio");

        // Registrar Service Worker para ativar a função de PWA instalável
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
