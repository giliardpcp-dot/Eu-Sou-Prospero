<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ypê Próspero - Gilliard Martins</title>
    
    <!-- Configurações para forçar o modo PWA de tela cheia -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ypê Próspero">
    <meta name="theme-color" content="#008060">
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #008060;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            opacity: 0.9;
        }
        .manual-link {
            margin-top: 25px;
            display: inline-block;
            background: #ffffff;
            color: #008060;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h2>Eu sou próspero - Gilliard Martins</h2>
        <p>Iniciando o aplicativo da Promoção Ypê...</p>
        
        <!-- Botão de segurança caso o redirecionamento automático demore -->
        <a href="https://www.promocaoype.com.br/index#inicio" id="linkDireto" class="manual-link">ENTRAR NA PROMOÇÃO</a>
    </div>

    <script>
        // Registra o Service Worker para manter o app instalado no celular
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // Executa o redirecionamento automático imediato para o site oficial
        setTimeout(function() {
            window.location.href = "https://www.promocaoype.com.br/index#inicio";
        }, 300);
    </script>
</body>
</html>
