<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ypê Próspero - Gilliard Martins</title>
    
    <!-- Configurações para o celular reconhecer como Aplicativo (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ypê Próspero">
    <meta name="theme-color" content="#008060">
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        /* Barra de identificação superior */
        .app-header {
            width: 100%;
            background-color: #008060;
            color: #ffffff;
            padding: 12px 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        /* Conteúdo central do app */
        .app-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 380px;
            width: 100%;
        }
        h1 {
            color: #008060;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #555555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        /* Botão principal de acesso */
        .btn-participar {
            display: block;
            width: 100%;
            background-color: #008060;
            color: #ffffff;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 128, 96, 0.3);
            transition: background 0.2s;
        }
        .btn-participar:active {
            background-color: #00664d;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
        }
    </style>
</head>
<body>

    <!-- Sua Identificação Exclusiva Fixa no Topo -->
    <header class="app-header">
        Eu sou próspero - Gilliard Martins
    </header>

    <!-- Painel do Aplicativo -->
    <div class="app-content">
        <div class="card">
            <h1>Promoção Ypê</h1>
            <p>Seu aplicativo exclusivo está pronto e configurado para uso. Toque no botão abaixo para abrir o portal de participação com segurança.</p>
            
            <a href="https://www.promocaoype.com.br/index#inicio" target="_blank" class="btn-participar">
                ACESSAR PROMOÇÃO YPÊ
            </a>
            
            <div class="footer-note">
                Ambiente seguro • Uso exclusivo Gilliard Martins
            </div>
        </div>
    </div>

    <script>
        // Registra o Service Worker para habilitar o ícone de instalação (PWA) no celular
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
